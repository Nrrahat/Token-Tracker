[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-observability-platform"
version = "0.1.0"
description = "A research platform for observing and optimizing AI agent executions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
ui = [
    "pandas>=2.2,<4.0",
    "plotly>=5.20,<7.0",
    "streamlit>=1.40,<2.0",
    "streamlit-ace>=0.1.1,<1.0",
]
providers = ["openai>=1.25,<3.0", "google-genai>=1.0,<2.0"]
additional-providers = ["anthropic>=0.25"]
tokenization = ["tiktoken>=0.7,<1.0"]

[dependency-groups]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["agents*", "analytics*", "config*", "core*", "dashboard*", "database*", "evaluation*", "experiments*", "exports*", "instrumentation*", "providers*", "skills*", "token_engine*", "tools*"]